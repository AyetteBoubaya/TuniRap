spring.application.name=ApiGetway
server.port=8099
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.default-zone=http://localhost:8761/eureka/

# Gateway CORS Configuration
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

# Route configuration for collaboration service
spring.cloud.gateway.routes[0].id=collaborationManagement
spring.cloud.gateway.routes[0].uri=lb://collaborationManagement
spring.cloud.gateway.routes[0].predicates[0]=Path=/collaboration/**

# Route configuration for Event service (courses and course resources)
spring.cloud.gateway.routes[1].id=ServiceEventManagement
spring.cloud.gateway.routes[1].uri=lb://ServiceEventManagement
spring.cloud.gateway.routes[1].predicates[0]=Path=/ServiceEventManagement/**

# Route configuration for notification service
spring.cloud.gateway.routes[2].id=notifications
spring.cloud.gateway.routes[2].uri=lb://notifications
spring.cloud.gateway.routes[2].predicates[0]=Path=/notifications/**

spring.cloud.gateway.routes[3].id=authservice
spring.cloud.gateway.routes[3].uri=lb://authservice
spring.cloud.gateway.routes[3].predicates[0]=Path=/authservice/**


spring.cloud.gateway.routes[4].id=catalogueManagement
spring.cloud.gateway.routes[4].uri=lb://catalogueManagement
spring.cloud.gateway.routes[4].predicates[0]=Path=/catalogueManagement/**

spring.cloud.gateway.routes[5].id=collaborationManagement
spring.cloud.gateway.routes[5].uri=lb://collaborationManagement
spring.cloud.gateway.routes[5].predicates[0]=Path=/collaborationManagement/**