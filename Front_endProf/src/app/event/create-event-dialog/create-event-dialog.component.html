<div class="create-event-dialog">
  <div class="modal-header">
    <h4 class="modal-title">Créer un nouvel événement</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <form #eventForm="ngForm" (ngSubmit)="onSubmit()">
      <!-- Section Image -->
      <div class="mb-4">
        <label class="form-label">Image de l'événement</label>
        <div class="image-upload-container">
          <!-- Aperçu de l'image -->
          <div class="image-preview" *ngIf="imagePreview">
            <img [src]="imagePreview" alt="Aperçu de l'image" class="preview-image">
            <button type="button" class="btn btn-danger btn-sm remove-image" (click)="removeImage()">
              <i class="fas fa-times"></i>
            </button>
          </div>
          
          <!-- Zone de dépôt -->
          <div class="drop-zone" 
               (click)="fileInput.click()"
               (dragover)="onDragOver($event)"
               (dragleave)="onDragLeave()"
               (drop)="onDrop($event)"
               [class.drag-over]="isDragOver">
            <div *ngIf="!imagePreview" class="drop-zone-content">
              <i class="fas fa-cloud-upload-alt fa-3x"></i>
              <p>Glissez-déposez une image ici ou cliquez pour sélectionner</p>
              <small class="text-muted">Formats supportés: JPG, PNG (Max 2MB)</small>
            </div>
            <input #fileInput type="file" class="d-none" accept="image/*" (change)="onFileSelected($event)">
          </div>
        </div>
      </div>

      <!-- Champs existants -->
      <div class="mb-3">
        <label for="title" class="form-label">Titre *</label>
        <input type="text" class="form-control" id="title" name="title" [(ngModel)]="event.title" required>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" name="description" [(ngModel)]="event.description" rows="3"></textarea>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="date" class="form-label">Date *</label>
          <input type="datetime-local" class="form-control" id="date" name="date" [(ngModel)]="event.date" required>
        </div>

        <div class="col-md-6 mb-3">
          <label for="location" class="form-label">Lieu *</label>
          <input type="text" class="form-control" id="location" name="location" [(ngModel)]="event.location" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Catégories de billets</label>
        <div class="ticket-categories">
          <div *ngFor="let category of categories; let i = index" class="ticket-category mb-3 p-3 border rounded">
            <div class="row">
              <div class="col-md-4">
                <label [for]="'categoryName'+i" class="form-label">Nom *</label>
                <input type="text" class="form-control" [id]="'categoryName'+i" [(ngModel)]="category.name" 
                       [name]="'categoryName'+i" required>
              </div>
              <div class="col-md-3">
                <label [for]="'categoryPrice'+i" class="form-label">Prix (DT) *</label>
                <input type="number" class="form-control" [id]="'categoryPrice'+i" [(ngModel)]="category.price" 
                       [name]="'categoryPrice'+i" min="0" step="0.01" required>
              </div>
              <div class="col-md-3">
                <label [for]="'categoryQuantity'+i" class="form-label">Quantité *</label>
                <input type="number" class="form-control" [id]="'categoryQuantity'+i" [(ngModel)]="category.quantity" 
                       [name]="'categoryQuantity'+i" min="1" required>
              </div>
              <div class="col-md-2 d-flex align-items-end">
                <button type="button" class="btn btn-danger btn-sm" (click)="removeCategory(i)" *ngIf="categories.length > 1">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" (click)="addCategory()">
          <i class="fas fa-plus"></i> Ajouter une catégorie
        </button>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="validated" [(ngModel)]="event.validated" name="validated">
        <label class="form-check-label" for="validated">
          Événement validé
        </label>
      </div>
    </form>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">Annuler</button>
    <button type="button" class="btn btn-primary" (click)="onSubmit()" [disabled]="!eventForm.valid || !imageFile">
      <i class="fas fa-save"></i> Enregistrer
    </button>
  </div>
</div>
