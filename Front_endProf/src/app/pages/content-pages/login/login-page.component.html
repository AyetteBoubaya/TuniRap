<!--Login Page Starts-->
<section id="login" class="body">
  <div class="row auth-height full-height-vh m-0">
    <div class="col-12 d-flex align-items-center justify-content-center">
      <div class="card overflow-hidden">
        <div class="card-content">
          <div class="card-body auth-img">
            <div class="row m-0">

              <div class="col-lg-6 d-none d-lg-flex justify-content-center align-items-center auth-img-bg p-3 ">
                <img src="assets/img/gallery/login.png" alt="" class="img-fluid" width="300" height="230">
              </div>
              <div class="col-lg-6 col-12 px-4 py-3">
                <h2 class="mb-2 card-title"><b><h2>Login</h2></b></h2>
                <p><b style="color:rgb(237, 10, 10)">Welcome back, please login to your account.</b></p>
                <ngb-alert type="dark" class="mb-2" *ngIf="isLoginFailed" (close)="isLoginFailed = false">
                  <p class="mb-0">Login failed!</p>
                </ngb-alert>
                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                  <div class="form-group" >
                    <input type="email" formControlName="email" class="form-control" placeholder="Email"
                      [ngClass]="{ 'is-invalid': loginFormSubmitted && lf.email.invalid, 'is-valid': loginFormSubmitted && !lf.email.invalid }"
                      required>
                    <div *ngIf="loginFormSubmitted && (lf.email.invalid || lf.email.errors?.required)"
                      class="help-block mt-1 text-dark"><i class="ft-alert-circle align-middle"></i><b> This is
                      required</b></div>
                  </div>
                  <div class="form-group">
                    <input type="password" formControlName="password" class="form-control" placeholder="Password"
                      [ngClass]="{ 'is-invalid': loginFormSubmitted && lf.password.invalid, 'is-valid': loginFormSubmitted && !lf.password.invalid }"
                      required>
                    <div *ngIf="loginFormSubmitted && (lf.password.invalid || lf.password.errors?.required)"
                      class="help-block mt-1 text-dark"><i class="ft-alert-circle align-middle"></i><b> This is
                      required</b></div>
                  </div>
                  <div class="d-sm-flex justify-content-between mb-3 font-small-2">
                    <div class="remember-me mb-2 mb-sm-0">
                      <div class="checkbox auth-checkbox">
                        <input type="checkbox" formControlName="rememberMe" class="form-control" id="rememberMe">
                        <label for="rememberMe"><span class="font-small-2 mb-3 "><p style="color:rgb(0, 0, 0)"><b>Remember Me</b></p></span></label>
                      </div>
                    </div>
                    <a [routerLink]="['/pages/forgotpassword']" class="text-dark"><b>Forgot Password?</b></a>
                  </div>
                  <div class="d-flex justify-content-between flex-sm-row flex-column">
                    <a [routerLink]="['/pages/register']" class="btn bg-very-light-danger mb-2 mb-sm-0">Register</a>
                    <button type="submit" class="btn bg-red-gradient mb-2 mb-sm-0"><b>Login</b></button>
                  </div>
                </form>
                <hr>
                <div class="d-flex justify-content-between align-items-center">
                  <h6 class="text-black m-0">Or Login With</h6>
                  <ngx-spinner></ngx-spinner>
                  <div class="login-options">
                    <a class="btn btn-sm btn-social-icon btn-facebook mr-1"><span class="fa fa-facebook"></span></a>
                    <a class="btn btn-sm btn-social-icon btn-twitter mr-1"><span class="fa fa-twitter"></span></a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!--Login Page Ends-->
