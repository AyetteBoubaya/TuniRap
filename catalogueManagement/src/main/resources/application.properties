# Application
spring.application.name=catalogueManagement
server.port=8089

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=catalogueManagement
# Désactivation temporaire de l'authentification pour le développement
spring.data.mongodb.auto-index-creation=true

# Elasticsearch Configuration
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=1s
spring.elasticsearch.socket-timeout=30s

# Spotify Scraper Service URL
spotify_url=http://127.0.0.1:8888

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092

# Consumer configuration
spring.kafka.consumer.group-id=catalogue-group-1
spring.kafka.consumer.auto-offset-reset=latest

# Deserializer configuration in KafkaConfig.java (ErrorHandlingDeserializer + JsonDeserializer)
# No key-deserializer/value-deserializer here to avoid conflicts

# JsonDeserializer specific properties (for trusted packages)
spring.kafka.consumer.properties.spring.json.trusted.packages=com.TuniRap.catalogueManagement.model
spring.kafka.consumer.properties.spring.json.value.default.type=com.TuniRap.catalogueManagement.model.CatalogueEvent

# Producer configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.spring.json.type.mapping=catalogueEvent:com.TuniRap.catalogueManagement.model.CatalogueEvent
spring.kafka.producer.properties.spring.json.trusted.packages=com.TuniRap.catalogueManagement.model

# Kafka Topics
kafka.topic.catalogue-events=catalogue-events

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
spring.cloud.compatibility-verifier.enabled=false
