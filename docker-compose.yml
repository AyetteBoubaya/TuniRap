version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  eureka-server:
    image: eureka-server:latest
    container_name: eureka-server
    build:
      context: ./EEureka
    ports:
      - "8761:8761"

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=notification
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    volumes:
      - mongodbdata:/data/db

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: collaborationmanagement
      MYSQL_ROOT_PASSWORD: system
    volumes:
      - mysqldata:/var/lib/mysql

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  notifications:
    build:
      context: ./notifications
    image: notifications
    container_name: notifications
    ports:
      - "8082:8082"
    depends_on:
      - kafka
      - mongodb
      - eureka-server

  collaborationManagement:
    build:
      context: ./collaborationManagement
    image: tunirap-collaboration
    container_name: collaborationManagement
    ports:
      - "8090:8090"
    depends_on:
      - mysql-db
      - eureka-server

  catalogueManagement:
    build:
      context: ./catalogueManagement
    image: tunirap-catalogue
    container_name: catalogueManagement
    ports:
      - "8089:8089"
    depends_on:
      - mongodb
      - elasticsearch
      - kafka
      - eureka-server

volumes:
  esdata:
  mongodbdata:
  kafka_data:
  mysqldata:
